[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "configplusplus"
version = "0.4.1"
description = "A powerful configuration management library with beautiful display, environment variables and YAML support"
authors = [{ name = "Florian BARRE" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
keywords = ["config", "configuration", "environment", "yaml", "settings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "python-dotenv>=1.2.4,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "loggerplusplus>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/Florian-BARRE/ConfigPlusPlus"
Repository = "https://github.com/Florian-BARRE/ConfigPlusPlus"
Documentation = "https://github.com/Florian-BARRE/ConfigPlusPlus#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/configplusplus"]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "black>=26.10.1,<26.11.0",
    "ruff>=0.17,<0.18",
    "mypy>=2.4.1,<3.0.0",
    "types-PyYAML>=6.0.12,<7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=configplusplus --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "loggerplusplus.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["configplusplus"]

[tool.coverage.report]
show_missing = true
